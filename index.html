<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나리와 보로: 산스의 결투</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top, #5d4557 0%, #2a1d2a 45%, #120d14 100%);
      color: #fff7f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-shell {
      width: min(1100px, 100%);
      position: relative;
    }

    .screen {
      width: 100%;
      background: rgba(20, 12, 20, 0.88);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* 타이틀 화면 */
    .title-screen {
      position: relative;
      min-height: 760px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        linear-gradient(rgba(15, 9, 17, 0.45), rgba(15, 9, 17, 0.72)),
        url("./images/Lose.png") center center / cover no-repeat;
    }

    .title-bg-art {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 80%, rgba(255, 170, 205, 0.18), transparent 24%),
        radial-gradient(circle at 82% 22%, rgba(190, 205, 255, 0.16), transparent 24%);
    }

    .title-content {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100% - 40px));
      text-align: center;
      padding: 48px 28px;
      border-radius: 28px;
      background: rgba(22, 12, 20, 0.52);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .title-kicker {
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #ffd3df;
      opacity: 0.9;
      margin-bottom: 16px;
    }

    .main-title {
      margin: 0;
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: #fff6fa;
      text-shadow: 0 0 24px rgba(255, 130, 170, 0.28);
    }

    .title-sub {
      margin: 18px auto 0;
      max-width: 560px;
      line-height: 1.7;
      color: #ffe8ef;
      opacity: 0.92;
      font-size: 16px;
    }

    .title-buttons {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .special-mode-panel {
      width: min(420px, 100%);
      margin: 18px auto 0;
      text-align: left;
    }

    .special-mode-list {
      margin-top: 12px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      display: grid;
      gap: 10px;
    }

    .mode-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: #fff7f2;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-option strong {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
      color: #fff2f7;
    }

    .mode-option span {
      display: block;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.82;
    }

    .mode-option:hover {
      background: rgba(255,255,255,0.12);
    }

    /* 게임 본편 */
    .game {
      width: 100%;
      background: rgba(20, 12, 20, 0.88);
      overflow: hidden;
    }

    .game-title {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.08em;
      padding: 18px 0 6px;
      color: #ffd4de;
      text-shadow: 0 0 16px rgba(255, 105, 135, 0.4);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      padding: 20px 24px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0));
    }

    .vs {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #ffd4de;
      text-shadow: 0 0 18px rgba(255, 105, 135, 0.4);
    }

    .status h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .hp-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hp-bar {
      height: 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff6c8b, #ffb36b);
      transition: width 300ms ease;
    }

    .enemy .hp-fill {
      background: linear-gradient(90deg, #7ed3ff, #8b8cff);
    }

    .arena {
      position: relative;
      height: 520px;
      overflow: hidden;
      background:
        linear-gradient(to top, rgba(0,0,0,0.25), rgba(0,0,0,0.08)),
        linear-gradient(180deg, #7a5a6e 0%, #9b7689 28%, #bd9bad 29%, #8c6a7c 30%, #6e4e60 100%);
    }

    .curtain {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(90,0,40,0.24) 0 8%, transparent 8% 92%, rgba(90,0,40,0.24) 92% 100%),
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 28%);
      pointer-events: none;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background: linear-gradient(180deg, #5d3848, #321a24);
      border-top: 4px solid rgba(255,255,255,0.08);
    }

    .fighter {
      position: absolute;
      bottom: 82px;
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 180ms ease;
      user-select: none;
    }

    .player { left: 100px; }
    .enemy { right: 100px; }

    .portrait {
      width: 180px;
      height: 260px;
      border-radius: 90px 90px 28px 28px;
      position: relative;
      border: 4px solid rgba(255,255,255,0.22);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.04);
    }

    .character-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .label {
      margin-top: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.18);
      font-weight: 700;
    }

    .hand {
      position: absolute;
      top: 120px;
      width: 88px;
      height: 18px;
      border-radius: 999px;
      background: #ffe3d7;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
      transition: transform 120ms ease;
      z-index: 3;
    }

    .player .hand {
      right: 10px;
      transform-origin: 10% 50%;
      transform: rotate(-15deg);
    }

    .enemy .hand {
      left: 10px;
      transform-origin: 90% 50%;
      transform: rotate(195deg);
    }

    .player.attack .hand {
      transform: translateX(80px) rotate(-2deg) scaleX(1.15);
    }

    .enemy.attack .hand {
      transform: translateX(-80px) rotate(182deg) scaleX(1.15);
    }

    .fighter.hit {
      animation: hitShake 280ms ease;
    }

    .arena.flash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.3);
      animation: flash 220ms ease;
      pointer-events: none;
    }

    @keyframes hitShake {
      0% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-16px) rotate(-4deg); }
      40% { transform: translateX(14px) rotate(3deg); }
      60% { transform: translateX(-10px) rotate(-2deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .impact {
      position: absolute;
      font-size: 48px;
      font-weight: 900;
      color: #fff4a8;
      text-shadow: 0 2px 0 #7b2e3d, 0 0 16px rgba(255,255,255,0.35);
      opacity: 0;
      transform: scale(0.6);
      pointer-events: none;
      z-index: 5;
    }

    .impact.show {
      animation: popImpact 500ms ease;
    }

    @keyframes popImpact {
      0% { opacity: 0; transform: scale(0.6) translateY(10px); }
      20% { opacity: 1; transform: scale(1.15) translateY(0); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: scale(1) translateY(-18px); }
    }

    .hud {
      padding: 16px 24px 24px;
      display: grid;
      gap: 16px;
      background: rgba(0,0,0,0.18);
    }

    .message-box {
      min-height: 82px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      line-height: 1.6;
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .timing-area {
      display: grid;
      gap: 10px;
    }

    .timing-label {
      font-size: 14px;
      color: #ffdfe8;
      opacity: 0.95;
    }

    .gauge {
      position: relative;
      height: 22px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .zone {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      opacity: 0.9;
    }

    .zone.good { left: 55%; width: 18%; background: rgba(255, 203, 95, 0.55); }
    .zone.perfect { left: 61.5%; width: 5%; background: rgba(173, 255, 155, 0.95); }

    .marker {
      position: absolute;
      top: -4px;
      width: 14px;
      height: 30px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.4);
      transform: translateX(-50%);
      left: 0%;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #2e1323;
      background: linear-gradient(180deg, #fff4f6, #ffc8d7);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    button.secondary {
      background: linear-gradient(180deg, #edf1ff, #bccbff);
      color: #1b2752;
    }

    button.mode-toggle {
      background: linear-gradient(180deg, #fef2ff, #e8c6ff);
      color: #3d194c;
    }

    button.result-btn,
    button.cutscene-btn {
      background: linear-gradient(180deg, #fff6fa, #ffd7e6);
      color: #4a1730;
      min-width: 140px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .small {
      font-size: 13px;
      opacity: 0.8;
    }

    .turn-badge {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      z-index: 3;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15,10,16,0.72);
      z-index: 20;
      padding: 20px;
    }

    .overlay.show {
      display: flex;
    }

    .result-screen,
    .cutscene-screen {
      position: relative;
      width: min(900px, calc(100% - 20px));
      height: min(460px, calc(100% - 20px));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-image-wrap,
    .cutscene-image-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.14);
      box-shadow: 0 20px 60px rgba(0,0,0,0.38);
      background: rgba(0,0,0,0.18);
    }

    .result-image,
    .cutscene-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      background: rgba(10, 6, 10, 0.45);
    }

    .cutscene-ui,
    .result-ui {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(20, 12, 20, 0.84);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
    }

    .result-caption,
    .cutscene-caption {
      font-size: 16px;
      line-height: 1.6;
      color: #fff0f5;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
      padding: 0;
      text-align: left;
      flex: 1;
      min-width: 240px;
    }

    .result-actions,
    .cutscene-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      flex-shrink: 0;
    }

    .cutscene-actions button,
    .result-actions button {
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .cutscene-actions button {
      background: linear-gradient(180deg, #fff4f6, #ff9bb3);
    }

    .result-actions button {
      background: linear-gradient(180deg, #fff6fa, #ffd7e6);
    }

    @media (max-width: 860px) {
      .title-screen {
        min-height: 680px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .vs {
        display: none;
      }

      .arena {
        height: 560px;
      }

      .player {
        left: 20px;
      }

      .enemy {
        right: 20px;
      }

      .fighter {
        width: 180px;
      }

      .portrait {
        width: 140px;
        height: 220px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .hand {
        top: 100px;
        width: 72px;
      }

      .player.attack .hand {
        transform: translateX(60px) rotate(-2deg) scaleX(1.12);
      }

      .enemy.attack .hand {
        transform: translateX(-60px) rotate(182deg) scaleX(1.12);
      }

      .game-title {
        font-size: 22px;
        padding: 16px 12px 4px;
      }

      .result-screen,
      .cutscene-screen {
        width: calc(100% - 8px);
        height: calc(100% - 8px);
      }

      .cutscene-ui,
      .result-ui {
        left: 12px;
        right: 12px;
        bottom: 12px;
        flex-direction: column;
        align-items: stretch;
      }

      .cutscene-caption,
      .result-caption {
        min-width: 0;
        text-align: center;
      }

      .cutscene-actions,
      .result-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div id="titleScreen" class="screen title-screen">
      <div class="title-bg-art"></div>

      <div class="title-content">
        <div class="title-kicker">NARI & BORO</div>
        <h1 class="main-title">나리와 보로: 산스의 결투</h1>
        <p class="title-sub">
          우아함과 손맛이 지배하는 귀족 결투. 타이밍을 맞춰 상대의 뺨을 날리고,
          산스의 결투에서 승리를 거머쥐세요.
        </p>

        <div class="title-buttons">
          <button id="startBtn">게임 시작</button>
          <button id="specialModeBtn" class="mode-toggle">특수 모드</button>
          <button id="exitBtn" class="secondary">게임 종료</button>
        </div>

        <div id="specialModePanel" class="special-mode-panel hidden">
          <div class="special-mode-list">
            <button id="boboModeBtn" class="mode-option">
              <strong>보로 모드</strong>
              <span>보로를 주인공으로 플레이하고, 나리를 상대로 결투합니다.</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="gameScreen" class="screen game hidden">
      <div class="game-title">나리와 보로: 산스의 결투</div>

      <div class="topbar">
        <div class="status player-status">
          <h2 id="playerNameTop">나리</h2>
          <div class="hp-wrap">
            <div class="hp-bar"><div id="playerHp" class="hp-fill"></div></div>
            <strong id="playerHpText">100</strong>
          </div>
        </div>

        <div class="vs">VS</div>

        <div class="status enemy">
          <h2 id="enemyNameTop">보로</h2>
          <div class="hp-wrap">
            <div class="hp-bar"><div id="enemyHp" class="hp-fill"></div></div>
            <strong id="enemyHpText">100</strong>
          </div>
        </div>
      </div>

      <div id="arena" class="arena">
        <div id="turnBadge" class="turn-badge">나리의 턴</div>

        <div id="playerFighter" class="fighter player">
          <div class="portrait">
            <img
              id="playerImage"
              src="./images/player.png"
              alt="나리 캐릭터"
              class="character-image"
              draggable="false"
            />
            <div class="hand"></div>
          </div>
          <div id="playerLabel" class="label">나리</div>
        </div>

        <div id="enemyFighter" class="fighter enemy">
          <div class="portrait">
            <img
              id="enemyImage"
              src="./images/rival.png"
              alt="보로 캐릭터"
              class="character-image"
              draggable="false"
            />
            <div class="hand"></div>
          </div>
          <div id="enemyLabel" class="label">보로</div>
        </div>

        <div id="impact" class="impact">찰싹!</div>
        <div class="curtain"></div>
        <div class="floor"></div>

        <!-- 컷씬 오버레이 -->
        <div id="cutsceneOverlay" class="overlay">
          <div class="cutscene-screen">
            <div class="cutscene-image-wrap">
              <img
                id="cutsceneImage"
                class="cutscene-image"
                src="./images/BoroAppear.png"
                alt="보로 등장 컷씬"
              />

              <div class="cutscene-ui">
                <div id="cutsceneCaption" class="cutscene-caption">
                  보로가 천천히 결투의 무대 위에 모습을 드러냈습니다.
                </div>
                <div class="cutscene-actions">
                  <button id="cutsceneStartBtn" class="cutscene-btn">결투 시작</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 결과 오버레이 -->
        <div id="overlay" class="overlay">
          <div class="result-screen">
            <div class="result-image-wrap">
              <img
                id="resultImage"
                class="result-image"
                src="./images/WinBoro.png"
                alt="결과 화면"
              />

              <div class="result-ui">
                <div id="resultCaption" class="result-caption">
                  결투가 끝났습니다.
                </div>
                <div class="result-actions">
                  <button onclick="restartGame()" class="result-btn">다시 시작</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="hud">
        <div id="messageBox" class="message-box">
          귀족의 결투가 시작되었습니다. 게이지가 움직일 때 타이밍을 맞춰 뺨을 날리세요.
        </div>

        <div class="controls">
          <div class="timing-area">
            <div class="timing-label">공격 타이밍 게이지 · 초록색이면 Perfect, 노란색이면 Good</div>
            <div class="gauge">
              <div class="zone good"></div>
              <div class="zone perfect"></div>
              <div id="marker" class="marker"></div>
            </div>
            <div class="small">플레이어의 턴일 때만 게이지가 움직입니다.</div>
          </div>

          <div class="buttons">
            <button id="slapBtn">뺨 때리기</button>
            <button id="resetBtn" class="secondary">리셋</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSETS = {
      titleBg: "./images/Lose.png",
      cutsceneBoroAppear: "./images/BoroAppear.png",
      win: "./images/WinBoro.png",
      lose: "./images/Lose.png",
    };

    const MODES = {
      normal: {
        key: "normal",
        playerName: "나리",
        enemyName: "보로",
        playerImage: "./images/player.png",
        enemyImage: "./images/rival.png",
        introMessage: "귀족의 결투가 시작되었습니다. 나리의 손끝으로 보로를 제압하세요.",
        restartMessage: "귀족의 결투가 다시 시작되었습니다. 이번엔 더 우아하게 뺨을 날려보세요.",
        playerTurnMessage: "나리의 턴입니다. 게이지를 보고 타이밍을 맞추세요.",
        playerPerfect: "Perfect! 나리의 품위 있으면서도 치명적인 일격입니다.",
        playerGood: "Good! 나리의 타이밍이 꽤 좋았습니다.",
        playerMiss: "헛손질! 나리의 타이밍이 어긋났습니다.",
        enemyReady: "보로가 자세를 가다듬고 있습니다...",
        enemyMiss: "보로의 공격이 빗나갔습니다.",
        enemyHit: "보로의 공격이 적중했습니다.",
        enemyCrit: "치명타! 보로가 날카로운 일격을 날렸습니다.",
        winCaption: "보로를 우아하게 쓰러뜨렸습니다.",
        loseCaption: "보로의 손맛에 무릎을 꿇었습니다.",
        winMessage: "결투 종료. 나리의 손끝이 더 매서웠습니다.",
        loseMessage: "결투 종료. 다음에는 더 정확한 타이밍을 노리세요.",
        useIntroCutscene: true,
        cutsceneImage: ASSETS.cutsceneBoroAppear,
        cutsceneCaption: "보로가 천천히 결투의 무대 위에 모습을 드러냈습니다."
      },
      boro: {
        key: "boro",
        playerName: "보로",
        enemyName: "나리",
        playerImage: "./images/rival.png",
        enemyImage: "./images/player.png",
        introMessage: "보로 모드가 시작되었습니다. 보로의 손끝으로 나리를 제압하세요.",
        restartMessage: "보로 모드가 다시 시작되었습니다. 이번엔 더 매섭게 일격을 날려보세요.",
        playerTurnMessage: "보로의 턴입니다. 게이지를 보고 타이밍을 맞추세요.",
        playerPerfect: "Perfect! 보로의 우아하고도 치명적인 일격입니다.",
        playerGood: "Good! 보로의 타이밍이 꽤 좋았습니다.",
        playerMiss: "헛손질! 보로의 타이밍이 어긋났습니다.",
        enemyReady: "나리가 자세를 가다듬고 있습니다...",
        enemyMiss: "나리의 공격이 빗나갔습니다.",
        enemyHit: "나리의 공격이 적중했습니다.",
        enemyCrit: "치명타! 나리가 날카로운 일격을 날렸습니다.",
        winCaption: "나리를 우아하게 쓰러뜨렸습니다.",
        loseCaption: "나리의 손맛에 무릎을 꿇었습니다.",
        winMessage: "결투 종료. 보로의 손끝이 더 매서웠습니다.",
        loseMessage: "결투 종료. 다음에는 더 정확한 타이밍을 노리세요.",
        useIntroCutscene: false,
        cutsceneImage: ASSETS.cutsceneBoroAppear,
        cutsceneCaption: ""
      }
    };

    const state = {
      playerHp: 100,
      enemyHp: 100,
      turn: "player",
      marker: 0,
      direction: 1,
      gaugeActive: true,
      busy: false,
      gameOver: false,
      started: false,
      currentMode: "normal",
      inCutscene: false,
    };

    const titleScreen = document.getElementById("titleScreen");
    const gameScreen = document.getElementById("gameScreen");
    const startBtn = document.getElementById("startBtn");
    const specialModeBtn = document.getElementById("specialModeBtn");
    const specialModePanel = document.getElementById("specialModePanel");
    const boboModeBtn = document.getElementById("boboModeBtn");
    const exitBtn = document.getElementById("exitBtn");

    const playerHpEl = document.getElementById("playerHp");
    const enemyHpEl = document.getElementById("enemyHp");
    const playerHpText = document.getElementById("playerHpText");
    const enemyHpText = document.getElementById("enemyHpText");
    const markerEl = document.getElementById("marker");
    const slapBtn = document.getElementById("slapBtn");
    const resetBtn = document.getElementById("resetBtn");
    const messageBox = document.getElementById("messageBox");
    const turnBadge = document.getElementById("turnBadge");
    const playerFighter = document.getElementById("playerFighter");
    const enemyFighter = document.getElementById("enemyFighter");
    const arena = document.getElementById("arena");
    const impact = document.getElementById("impact");

    const overlay = document.getElementById("overlay");
    const resultImage = document.getElementById("resultImage");
    const resultCaption = document.getElementById("resultCaption");

    const cutsceneOverlay = document.getElementById("cutsceneOverlay");
    const cutsceneImage = document.getElementById("cutsceneImage");
    const cutsceneCaption = document.getElementById("cutsceneCaption");
    const cutsceneStartBtn = document.getElementById("cutsceneStartBtn");

    const playerNameTop = document.getElementById("playerNameTop");
    const enemyNameTop = document.getElementById("enemyNameTop");
    const playerLabel = document.getElementById("playerLabel");
    const enemyLabel = document.getElementById("enemyLabel");
    const playerImage = document.getElementById("playerImage");
    const enemyImage = document.getElementById("enemyImage");

    function getMode() {
      return MODES[state.currentMode];
    }

    function applyModeToUI() {
      const mode = getMode();

      playerNameTop.textContent = mode.playerName;
      enemyNameTop.textContent = mode.enemyName;
      playerLabel.textContent = mode.playerName;
      enemyLabel.textContent = mode.enemyName;

      playerImage.src = mode.playerImage;
      enemyImage.src = mode.enemyImage;

      playerImage.alt = `${mode.playerName} 캐릭터`;
      enemyImage.alt = `${mode.enemyName} 캐릭터`;
    }

    function updateUI() {
      const mode = getMode();

      playerHpEl.style.width = `${state.playerHp}%`;
      enemyHpEl.style.width = `${state.enemyHp}%`;
      playerHpText.textContent = state.playerHp;
      enemyHpText.textContent = state.enemyHp;
      markerEl.style.left = `${state.marker}%`;
      turnBadge.textContent = state.turn === "player"
        ? `${mode.playerName}의 턴`
        : `${mode.enemyName}의 턴`;

      slapBtn.disabled =
        state.turn !== "player" ||
        state.busy ||
        state.gameOver ||
        !state.started ||
        state.inCutscene;
    }

    function setMessage(text) {
      messageBox.textContent = text;
    }

    function animateGauge() {
      if (state.started && !state.gameOver && !state.inCutscene) {
        if (state.gaugeActive && state.turn === "player" && !state.busy) {
          state.marker += state.direction * 1.8;

          if (state.marker >= 100) {
            state.marker = 100;
            state.direction = -1;
          }

          if (state.marker <= 0) {
            state.marker = 0;
            state.direction = 1;
          }

          markerEl.style.left = `${state.marker}%`;
        }
      }

      requestAnimationFrame(animateGauge);
    }

    function getTimingResult(value) {
      if (value >= 61.5 && value <= 66.5) return "perfect";
      if (value >= 55 && value <= 73) return "good";
      return "miss";
    }

    function showImpact(text, x, y) {
      impact.textContent = text;
      impact.style.left = `${x}px`;
      impact.style.top = `${y}px`;
      impact.classList.remove("show");
      void impact.offsetWidth;
      impact.classList.add("show");
    }

    function doHit(attacker, damage, resultTextValue) {
      const targetEl = attacker === "player" ? enemyFighter : playerFighter;
      const attackerEl = attacker === "player" ? playerFighter : enemyFighter;

      attackerEl.classList.add("attack");
      targetEl.classList.add("hit");
      arena.classList.add("flash");

      const impactX = attacker === "player" ? arena.clientWidth * 0.64 : arena.clientWidth * 0.28;
      const impactY = 180;

      showImpact(resultTextValue, impactX, impactY);

      setTimeout(() => {
        attackerEl.classList.remove("attack");
        targetEl.classList.remove("hit");
        arena.classList.remove("flash");
      }, 280);

      if (attacker === "player") {
        state.enemyHp = Math.max(0, state.enemyHp - damage);
      } else {
        state.playerHp = Math.max(0, state.playerHp - damage);
      }

      updateUI();
      checkGameOver();
    }

    function showResultScreen(type) {
      const mode = getMode();

      if (type === "win") {
        resultImage.src = ASSETS.win;
        resultImage.alt = "승리 화면";
        resultCaption.textContent = mode.winCaption;
      } else {
        resultImage.src = ASSETS.lose;
        resultImage.alt = "패배 화면";
        resultCaption.textContent = mode.loseCaption;
      }

      overlay.classList.add("show");
    }

    function checkGameOver() {
      const mode = getMode();

      if (state.enemyHp <= 0) {
        state.gameOver = true;
        showResultScreen("win");
        setMessage(mode.winMessage);
      } else if (state.playerHp <= 0) {
        state.gameOver = true;
        showResultScreen("lose");
        setMessage(mode.loseMessage);
      }

      updateUI();
    }

    function playerAttack() {
      const mode = getMode();

      if (state.turn !== "player" || state.busy || state.gameOver || !state.started || state.inCutscene) return;

      state.busy = true;
      const timing = getTimingResult(state.marker);

      if (timing === "perfect") {
        setMessage(mode.playerPerfect);
        doHit("player", 28, "POW!");
      } else if (timing === "good") {
        setMessage(mode.playerGood);
        doHit("player", 18, "찰싹!");
      } else {
        setMessage(mode.playerMiss);
        showImpact("MISS", arena.clientWidth * 0.62, 180);
      }

      setTimeout(() => {
        if (!state.gameOver) {
          state.turn = "enemy";
          updateUI();
          enemyTurn();
        }
      }, 700);
    }

    function enemyTurn() {
      const mode = getMode();

      setMessage(mode.enemyReady);

      setTimeout(() => {
        if (state.gameOver || state.inCutscene) return;

        const roll = Math.random();
        let damage = 0;
        let text = "";

        if (roll < 0.2) {
          setMessage(mode.enemyMiss);
          showImpact("MISS", arena.clientWidth * 0.28, 180);
        } else if (roll < 0.75) {
          damage = 16;
          text = "짝!";
          setMessage(mode.enemyHit);
          doHit("enemy", damage, text);
        } else {
          damage = 24;
          text = "강타!";
          setMessage(mode.enemyCrit);
          doHit("enemy", damage, text);
        }

        setTimeout(() => {
          if (!state.gameOver) {
            state.turn = "player";
            state.busy = false;
            setMessage(mode.playerTurnMessage);
            updateUI();
          }
        }, 700);
      }, 900);
    }

    function openIntroCutscene() {
      const mode = getMode();

      state.inCutscene = true;
      cutsceneImage.src = mode.cutsceneImage;
      cutsceneImage.alt = `${mode.enemyName} 등장 컷씬`;
      cutsceneCaption.textContent = mode.cutsceneCaption || `${mode.enemyName}가 등장했습니다.`;
      cutsceneOverlay.classList.add("show");
      setMessage(`${mode.enemyName}가 결투장에 등장하고 있습니다...`);
      updateUI();
    }

    function closeIntroCutscene() {
      const mode = getMode();

      state.inCutscene = false;
      cutsceneOverlay.classList.remove("show");
      setMessage(mode.introMessage);
      updateUI();
    }

    function restartGame() {
      const mode = getMode();

      state.playerHp = 100;
      state.enemyHp = 100;
      state.turn = "player";
      state.marker = 0;
      state.direction = 1;
      state.gaugeActive = true;
      state.busy = false;
      state.gameOver = false;
      state.started = true;
      state.inCutscene = false;

      applyModeToUI();
      overlay.classList.remove("show");
      cutsceneOverlay.classList.remove("show");
      setMessage(mode.restartMessage);
      updateUI();

      if (mode.useIntroCutscene) {
        openIntroCutscene();
      }
    }

    function startGame(modeKey = "normal") {
      state.currentMode = modeKey;
      applyModeToUI();

      titleScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");

      restartGame();
    }

    function toggleSpecialMode() {
      specialModePanel.classList.toggle("hidden");
    }

    function exitGame() {
      const closed = window.close();

      setTimeout(() => {
        if (!closed) {
          alert("브라우저에서는 보안상 창이 바로 닫히지 않을 수 있습니다. 탭을 직접 닫아 주세요.");
        }
      }, 100);
    }

    slapBtn.addEventListener("click", playerAttack);
    resetBtn.addEventListener("click", restartGame);

    startBtn.addEventListener("click", () => startGame("normal"));
    specialModeBtn.addEventListener("click", toggleSpecialMode);
    boboModeBtn.addEventListener("click", () => startGame("boro"));
    exitBtn.addEventListener("click", exitGame);
    cutsceneStartBtn.addEventListener("click", closeIntroCutscene);

    window.restartGame = restartGame;

    applyModeToUI();
    updateUI();
    animateGauge();
  </script>
</body>
</html>
