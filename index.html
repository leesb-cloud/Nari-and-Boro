<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나리와 보로: 산스의 결투</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top, #5d4557 0%, #2a1d2a 45%, #120d14 100%);
      color: #fff7f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game {
      width: min(1100px, 100%);
      background: rgba(20, 12, 20, 0.88);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      padding: 20px 24px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0));
    }

    .vs {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #ffd4de;
      text-shadow: 0 0 18px rgba(255, 105, 135, 0.4);
    }

    .status h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .hp-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hp-bar {
      height: 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff6c8b, #ffb36b);
      transition: width 300ms ease;
    }

    .enemy .hp-fill {
      background: linear-gradient(90deg, #7ed3ff, #8b8cff);
    }

    .arena {
      position: relative;
      height: 520px;
      overflow: hidden;
      background:
        linear-gradient(to top, rgba(0,0,0,0.25), rgba(0,0,0,0.08)),
        linear-gradient(180deg, #7a5a6e 0%, #9b7689 28%, #bd9bad 29%, #8c6a7c 30%, #6e4e60 100%);
    }

    .curtain {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(90,0,40,0.24) 0 8%, transparent 8% 92%, rgba(90,0,40,0.24) 92% 100%),
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 28%);
      pointer-events: none;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background: linear-gradient(180deg, #5d3848, #321a24);
      border-top: 4px solid rgba(255,255,255,0.08);
    }

    .fighter {
      position: absolute;
      bottom: 82px;
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 180ms ease;
      user-select: none;
    }

    .player { left: 100px; }
    .enemy { right: 100px; }

    .portrait {
      width: 180px;
      height: 260px;
      border-radius: 90px 90px 28px 28px;
      position: relative;
      border: 4px solid rgba(255,255,255,0.22);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.04);
    }

    .character-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .label {
      margin-top: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.18);
      font-weight: 700;
    }

    .hand {
      position: absolute;
      top: 120px;
      width: 88px;
      height: 18px;
      border-radius: 999px;
      background: #ffe3d7;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
      transition: transform 120ms ease;
      z-index: 3;
    }

    .player .hand {
      right: 10px;
      transform-origin: 10% 50%;
      transform: rotate(-15deg);
    }

    .enemy .hand {
      left: 10px;
      transform-origin: 90% 50%;
      transform: rotate(195deg);
    }

    .player.attack .hand {
      transform: translateX(80px) rotate(-2deg) scaleX(1.15);
    }

    .enemy.attack .hand {
      transform: translateX(-80px) rotate(182deg) scaleX(1.15);
    }

    .fighter.hit {
      animation: hitShake 280ms ease;
    }

    .arena.flash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.3);
      animation: flash 220ms ease;
      pointer-events: none;
    }

    @keyframes hitShake {
      0% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-16px) rotate(-4deg); }
      40% { transform: translateX(14px) rotate(3deg); }
      60% { transform: translateX(-10px) rotate(-2deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .impact {
      position: absolute;
      font-size: 48px;
      font-weight: 900;
      color: #fff4a8;
      text-shadow: 0 2px 0 #7b2e3d, 0 0 16px rgba(255,255,255,0.35);
      opacity: 0;
      transform: scale(0.6);
      pointer-events: none;
      z-index: 5;
    }

    .impact.show {
      animation: popImpact 500ms ease;
    }

    @keyframes popImpact {
      0% { opacity: 0; transform: scale(0.6) translateY(10px); }
      20% { opacity: 1; transform: scale(1.15) translateY(0); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: scale(1) translateY(-18px); }
    }

    .hud {
      padding: 16px 24px 24px;
      display: grid;
      gap: 16px;
      background: rgba(0,0,0,0.18);
    }

    .message-box {
      min-height: 82px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      line-height: 1.6;
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .timing-area {
      display: grid;
      gap: 10px;
    }

    .timing-label {
      font-size: 14px;
      color: #ffdfe8;
      opacity: 0.95;
    }

    .gauge {
      position: relative;
      height: 22px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .zone {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      opacity: 0.9;
    }

    .zone.good { left: 55%; width: 18%; background: rgba(255, 203, 95, 0.55); }
    .zone.perfect { left: 61.5%; width: 5%; background: rgba(173, 255, 155, 0.95); }

    .marker {
      position: absolute;
      top: -4px;
      width: 14px;
      height: 30px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.4);
      transform: translateX(-50%);
      left: 0%;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #2e1323;
      background: linear-gradient(180deg, #fff4f6, #ffc8d7);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    button.secondary {
      background: linear-gradient(180deg, #edf1ff, #bccbff);
      color: #1b2752;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .small {
      font-size: 13px;
      opacity: 0.8;
    }

    .turn-badge {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      z-index: 3;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15,10,16,0.72);
      z-index: 10;
    }

    .overlay.show { display: flex; }

    .result-card {
      width: min(460px, calc(100% - 30px));
      background: linear-gradient(180deg, #fff6f8, #ffd8e5);
      color: #4a1730;
      border-radius: 28px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .result-card h3 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .result-card p {
      margin: 0 0 18px;
      line-height: 1.6;
    }

    @media (max-width: 860px) {
      .topbar { grid-template-columns: 1fr; }
      .vs { display: none; }
      .arena { height: 560px; }
      .player { left: 20px; }
      .enemy { right: 20px; }
      .fighter { width: 180px; }
      .portrait { width: 140px; height: 220px; }
      .controls { grid-template-columns: 1fr; }

      .hand {
        top: 100px;
        width: 72px;
      }

      .player.attack .hand {
        transform: translateX(60px) rotate(-2deg) scaleX(1.12);
      }

      .enemy.attack .hand {
        transform: translateX(-60px) rotate(182deg) scaleX(1.12);
      }
  .game-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.08em;
    padding: 18px 0 6px;
    color: #ffd4de;
    text-shadow: 0 0 16px rgba(255, 105, 135, 0.4);
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="topbar">
      <div class="status player-status">
        <h2>플레이어</h2>
        <div class="hp-wrap">
          <div class="hp-bar"><div id="playerHp" class="hp-fill"></div></div>
          <strong id="playerHpText">100</strong>
        </div>
      </div>
      <div class="vs">VS</div>
      <div class="status enemy">
        <h2>라이벌 영애</h2>
        <div class="hp-wrap">
          <div class="hp-bar"><div id="enemyHp" class="hp-fill"></div></div>
          <strong id="enemyHpText">100</strong>
        </div>
      </div>
    </div>

    <div id="arena" class="arena">
      <div id="turnBadge" class="turn-badge">플레이어 턴</div>

      <div id="playerFighter" class="fighter player">
        <div class="portrait">
          <img
            src="./images/player.png"
            alt="플레이어 캐릭터"
            class="character-image"
            draggable="false"
          />
          <div class="hand"></div>
        </div>
        <div class="label">임시 캐릭터 A</div>
      </div>

      <div id="enemyFighter" class="fighter enemy">
        <div class="portrait">
          <img
            src="./images/rival.png"
            alt="라이벌 캐릭터"
            class="character-image"
            draggable="false"
          />
          <div class="hand"></div>
        </div>
        <div class="label">임시 캐릭터 B</div>
      </div>

      <div id="impact" class="impact">찰싹!</div>
      <div class="curtain"></div>
      <div class="floor"></div>

      <div id="overlay" class="overlay">
        <div class="result-card">
          <h3 id="resultTitle">승리!</h3>
          <p id="resultText">상대를 우아하게 쓰러뜨렸습니다.</p>
          <button onclick="restartGame()">다시 시작</button>
        </div>
      </div>
    </div>

    <div class="hud">
      <div id="messageBox" class="message-box">
        귀족의 결투가 시작되었습니다. 게이지가 움직일 때 타이밍을 맞춰 뺨을 날리세요.
      </div>

      <div class="controls">
        <div class="timing-area">
          <div class="timing-label">공격 타이밍 게이지 · 초록색이면 Perfect, 노란색이면 Good</div>
          <div class="gauge">
            <div class="zone good"></div>
            <div class="zone perfect"></div>
            <div id="marker" class="marker"></div>
          </div>
          <div class="small">플레이어 턴일 때만 게이지가 움직입니다.</div>
        </div>

        <div class="buttons">
          <button id="slapBtn">뺨 때리기</button>
          <button id="resetBtn" class="secondary">리셋</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      playerHp: 100,
      enemyHp: 100,
      turn: "player",
      marker: 0,
      direction: 1,
      gaugeActive: true,
      busy: false,
      gameOver: false,
    };

    const playerHpEl = document.getElementById("playerHp");
    const enemyHpEl = document.getElementById("enemyHp");
    const playerHpText = document.getElementById("playerHpText");
    const enemyHpText = document.getElementById("enemyHpText");
    const markerEl = document.getElementById("marker");
    const slapBtn = document.getElementById("slapBtn");
    const resetBtn = document.getElementById("resetBtn");
    const messageBox = document.getElementById("messageBox");
    const turnBadge = document.getElementById("turnBadge");
    const playerFighter = document.getElementById("playerFighter");
    const enemyFighter = document.getElementById("enemyFighter");
    const arena = document.getElementById("arena");
    const impact = document.getElementById("impact");
    const overlay = document.getElementById("overlay");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");

    function updateUI() {
      playerHpEl.style.width = `${state.playerHp}%`;
      enemyHpEl.style.width = `${state.enemyHp}%`;
      playerHpText.textContent = state.playerHp;
      enemyHpText.textContent = state.enemyHp;
      markerEl.style.left = `${state.marker}%`;
      turnBadge.textContent = state.turn === "player" ? "플레이어 턴" : "라이벌 턴";
      slapBtn.disabled = state.turn !== "player" || state.busy || state.gameOver;
    }

    function setMessage(text) {
      messageBox.textContent = text;
    }

    function animateGauge() {
      if (state.gameOver) return;

      if (state.gaugeActive && state.turn === "player" && !state.busy) {
        state.marker += state.direction * 1.8;

        if (state.marker >= 100) {
          state.marker = 100;
          state.direction = -1;
        }

        if (state.marker <= 0) {
          state.marker = 0;
          state.direction = 1;
        }

        markerEl.style.left = `${state.marker}%`;
      }

      requestAnimationFrame(animateGauge);
    }

    function getTimingResult(value) {
      if (value >= 61.5 && value <= 66.5) return "perfect";
      if (value >= 55 && value <= 73) return "good";
      return "miss";
    }

    function showImpact(text, x, y) {
      impact.textContent = text;
      impact.style.left = `${x}px`;
      impact.style.top = `${y}px`;
      impact.classList.remove("show");
      void impact.offsetWidth;
      impact.classList.add("show");
    }

    function doHit(attacker, damage, resultTextValue) {
      const targetEl = attacker === "player" ? enemyFighter : playerFighter;
      const attackerEl = attacker === "player" ? playerFighter : enemyFighter;

      attackerEl.classList.add("attack");
      targetEl.classList.add("hit");
      arena.classList.add("flash");

      const impactX = attacker === "player" ? arena.clientWidth * 0.64 : arena.clientWidth * 0.28;
      const impactY = 180;

      showImpact(resultTextValue, impactX, impactY);

      setTimeout(() => {
        attackerEl.classList.remove("attack");
        targetEl.classList.remove("hit");
        arena.classList.remove("flash");
      }, 280);

      if (attacker === "player") {
        state.enemyHp = Math.max(0, state.enemyHp - damage);
      } else {
        state.playerHp = Math.max(0, state.playerHp - damage);
      }

      updateUI();
      checkGameOver();
    }

    function checkGameOver() {
      if (state.enemyHp <= 0) {
        state.gameOver = true;
        resultTitle.textContent = "승리!";
        resultText.textContent = "상대를 우아하게 쓰러뜨렸습니다.";
        overlay.classList.add("show");
        setMessage("결투 종료. 당신의 손끝이 더 매서웠습니다.");
      } else if (state.playerHp <= 0) {
        state.gameOver = true;
        resultTitle.textContent = "패배";
        resultText.textContent = "라이벌의 손맛에 무릎을 꿇었습니다.";
        overlay.classList.add("show");
        setMessage("결투 종료. 다음에는 더 정확한 타이밍을 노리세요.");
      }

      updateUI();
    }

    function playerAttack() {
      if (state.turn !== "player" || state.busy || state.gameOver) return;

      state.busy = true;
      const timing = getTimingResult(state.marker);

      if (timing === "perfect") {
        setMessage("Perfect! 품위 있으면서도 치명적인 일격입니다.");
        doHit("player", 28, "완벽!");
      } else if (timing === "good") {
        setMessage("Good! 꽤 괜찮은 타이밍입니다.");
        doHit("player", 18, "찰싹!");
      } else {
        setMessage("헛손질! 타이밍이 어긋났습니다.");
        showImpact("MISS", arena.clientWidth * 0.62, 180);
      }

      setTimeout(() => {
        if (!state.gameOver) {
          state.turn = "enemy";
          updateUI();
          enemyTurn();
        }
      }, 700);
    }

    function enemyTurn() {
      setMessage("라이벌이 자세를 가다듬고 있습니다...");

      setTimeout(() => {
        if (state.gameOver) return;

        const roll = Math.random();
        let damage = 0;
        let text = "";

        if (roll < 0.2) {
          setMessage("라이벌의 공격이 빗나갔습니다.");
          showImpact("MISS", arena.clientWidth * 0.28, 180);
        } else if (roll < 0.75) {
          damage = 16;
          text = "짝!";
          setMessage("라이벌의 공격이 적중했습니다.");
          doHit("enemy", damage, text);
        } else {
          damage = 24;
          text = "강타!";
          setMessage("치명타! 라이벌이 날카로운 일격을 날렸습니다.");
          doHit("enemy", damage, text);
        }

        setTimeout(() => {
          if (!state.gameOver) {
            state.turn = "player";
            state.busy = false;
            setMessage("당신의 턴입니다. 게이지를 보고 타이밍을 맞추세요.");
            updateUI();
          }
        }, 700);
      }, 900);
    }

    function restartGame() {
      state.playerHp = 100;
      state.enemyHp = 100;
      state.turn = "player";
      state.marker = 0;
      state.direction = 1;
      state.gaugeActive = true;
      state.busy = false;
      state.gameOver = false;

      overlay.classList.remove("show");
      setMessage("귀족의 결투가 다시 시작되었습니다. 이번엔 더 우아하게 뺨을 날려보세요.");
      updateUI();
    }

    slapBtn.addEventListener("click", playerAttack);
    resetBtn.addEventListener("click", restartGame);
    window.restartGame = restartGame;

    updateUI();
    animateGauge();
  </script>
</body>
</html>
